spring:
  application:
    name: bd-bank-compliance-backend

  # Charge .env à la racine du projet (DB_HOST, DB_USER, etc.)
  # même si le shell n'a pas sourcé le fichier au préalable.
  config:
    import: optional:file:.env[.properties]

  # Configuration JPA/Hibernate pour la persistance interne (J11)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Connexion à la base de persistance interne H2 (J11)
  # Stocke les règles, alertes et configuration de périmètre
  datasource:
    # Datasource principale : H2 pour la persistance interne
    url: jdbc:h2:file:./data/compliance_db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # Configuration secondaire pour la bd_bank (lecture seule)
  # Cette datasource sera configurée manuellement via @Configuration
  # pour éviter les conflits avec la datasource principale H2

server:
  port: ${SERVER_PORT:8080}

# Périmètre des tables surveillées (J5) - liste séparée par des virgules.
# Chaque table déclarée doit exister réellement dans la bd_bank, sinon
# l'application refuse de démarrer (voir ScopeService).
bdbank:
  setup-key: ${BDBANK_SETUP_KEY:}
  scope:
    tables: ${BDBANK_SCOPE_TABLES:clients,comptes,transactions}

logging:
  level:
    root: INFO
    com.bridge.bdbank: DEBUG
