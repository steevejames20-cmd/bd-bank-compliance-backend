spring:
  # Configuration pour les tests e2e avec la vraie base MySQL
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Datasource H2 pour la persistance interne (règles, alertes)
  datasource:
    url: jdbc:h2:file:./data/compliance_db
    username: sa
    password:
    driver-class-name: org.h2.Driver

# Configuration pour les tests e2e avec MySQL
bdbank:
  startup:
    checks:
      enabled: false  # Désactivé pour les tests pour éviter les échecs de contexte
  scope:
    tables: clients,comptes,transactions