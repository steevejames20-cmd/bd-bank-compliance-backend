spring:
  # Configuration JPA/Hibernate pour les tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Datasource H2 en mémoire pour les tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # Désactiver la configuration secondaire pour les tests
  # On utilisera un mock pour la bd_bank dans les tests de persistance

# Désactiver les runners de démarrage pour les tests
# pour éviter les connexions à la base MySQL réelle
bdbank:
  startup:
    checks:
      enabled: false
  scope:
    tables: